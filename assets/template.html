<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>指鹿為馬</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@500;900&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#16120f; --paper:#f1ebe0; --ink:#2a2118; --accent:#c9922e; --red:#a8322a;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{
    background:var(--bg); color:var(--paper);
    font-family:"Noto Serif TC","Microsoft JhengHei",serif;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    padding:16px; gap:14px; min-height:100vh;
  }
  .stage{
    position:relative; width:min(100%, calc((100vh - 120px) * 1376 / 768), 1280px);
    aspect-ratio:1376/768; overflow:hidden; border-radius:10px;
    background:#000; box-shadow:0 10px 40px rgba(0,0,0,.6);
  }
  .stage:fullscreen{width:100vw;max-width:none;border-radius:0;aspect-ratio:auto;height:100vh}
  .stage:fullscreen .cam{inset:0;margin:auto;width:min(100vw,100vh*1376/768);height:auto;aspect-ratio:1376/768}
  .cam{position:absolute; inset:0; will-change:transform}
  .cam img{position:absolute; inset:0; width:100%; height:100%; object-fit:cover; opacity:0; transition:opacity 1.1s}
  .cam img.on{opacity:1}
  /* 口形：closed＝畫一張會開合的嘴；open＝把原圖嘴巴那塊往下拉長 */
  .mouth{position:absolute; transform:translate(-50%,0) scaleY(0); transform-origin:50% 0; pointer-events:none; opacity:0}
  .mouth.closed{transform:translate(-50%,0)}
  .mouth.closed svg{display:block; width:100%; height:100%; overflow:visible}
  .mouth.open{background-repeat:no-repeat;
    -webkit-mask-image:radial-gradient(ellipse 50% 50% at 50% 50%, #000 60%, transparent 100%);
            mask-image:radial-gradient(ellipse 50% 50% at 50% 50%, #000 60%, transparent 100%)}

  .flash{position:absolute;inset:0;background:#fff8dc;opacity:0;pointer-events:none}
  .dark{position:absolute;inset:0;background:#000;opacity:0;pointer-events:none;transition:opacity 1.5s}
  .vignette{position:absolute;inset:0;pointer-events:none;
    background:radial-gradient(ellipse at center, transparent 55%, rgba(0,0,0,.5) 100%)}
  .spot{position:absolute;inset:0;pointer-events:none;opacity:0;transition:opacity .8s, background .8s}

  .label{
    position:absolute; top:3.5%; left:3%; padding:.35em .9em; font-size:clamp(12px,1.8vw,20px);
    background:rgba(20,15,10,.72); border-left:4px solid var(--accent); border-radius:4px;
    opacity:0; transform:translateX(-12px); transition:.6s;
  }
  .label.on{opacity:1; transform:none}

  .subs{
    position:absolute; left:0; right:0; bottom:0; padding:5% 6% 3.2%;
    background:linear-gradient(transparent, rgba(0,0,0,.8) 45%);
    text-align:center; font-size:clamp(14px,2.4vw,28px); line-height:1.5; font-weight:500;
    text-shadow:0 2px 4px #000; min-height:22%; display:flex; align-items:flex-end; justify-content:center;
    transition:opacity .4s;
  }
  .subs.hide{opacity:0}
  .subs .zhao{color:#e0b3ff}
  .subs .emp{color:#ffd66b}
  .subs .toady{color:#ffab80}
  .subs .loyal{color:#9fe0ff}

  .bubble{
    position:absolute; padding:.4em .8em; font-weight:900; color:var(--ink);
    background:#fffdf5; border:3px solid var(--ink); border-radius:999px;
    font-size:clamp(14px,2.6vw,36px); white-space:nowrap;
    transform:translate(-50%,-50%) scale(0); transition:transform .35s cubic-bezier(.3,1.8,.5,1);
    pointer-events:none;
  }
  .bubble.on{transform:translate(-50%,-50%) scale(1)}
  .bubble.shout{background:var(--red); color:#fff; border-color:#fff; border-radius:12px}
  .bubble.cold{background:#2b1d36; color:#f0dcff; border-color:#c9a2ea; border-radius:12px}
  .bubble.true{background:#e8f6ff; color:#103a52; border-color:#2a6f96}

  .stamp{
    position:absolute; left:50%; top:42%; transform:translate(-50%,-50%) scale(0);
    font-size:clamp(40px,10vw,140px); font-weight:900; color:#fff3c4; letter-spacing:.08em;
    -webkit-text-stroke:3px #5a1a10; text-shadow:0 0 30px rgba(255,120,80,.8), 6px 6px 0 #5a1a10;
    pointer-events:none; opacity:0; white-space:nowrap;
  }

  .card{
    position:absolute; inset:0; background:var(--paper); color:var(--ink);
    display:flex; align-items:center; justify-content:center; gap:3%;
    transition:opacity .8s; padding:4%;
  }
  .card.hidden{opacity:0; pointer-events:none}
  .card img{mix-blend-mode:multiply; height:80%; width:26%; object-fit:cover; flex:none}
  .card .txt{text-align:center; flex:1; min-width:0}
  .card h1{font-size:clamp(36px,8vw,108px); margin:0; font-weight:900; letter-spacing:.12em; line-height:1.1}
  .card h1 small{display:block;font-size:.22em;letter-spacing:.3em;font-weight:500;color:#7a6650;margin-top:.6em}
  .card p{font-size:clamp(13px,1.9vw,24px); line-height:1.7; margin:.6em 0}
  .card .moral{border-top:2px solid var(--accent); border-bottom:2px solid var(--accent); padding:.6em 0}
  .card .zhuyin{color:#7a6650; font-size:clamp(12px,1.6vw,20px); letter-spacing:.2em}
  .btn-play{
    margin-top:1em; font:inherit; font-size:clamp(16px,2.4vw,28px); font-weight:900;
    background:var(--red); color:#fff; border:0; border-radius:999px; padding:.5em 1.6em; cursor:pointer;
    box-shadow:0 4px 0 #5e1b15; transition:transform .1s;
  }
  .btn-play:hover{transform:translateY(-2px)}
  .btn-play:active{transform:translateY(2px);box-shadow:0 2px 0 #5e1b15}

  .controls{display:flex; gap:10px; align-items:center; flex-wrap:wrap; justify-content:center;
    width:min(100%,1280px)}
  .controls button{
    font:inherit; font-size:15px; background:#2e271f; color:var(--paper); border:1px solid #4a3f33;
    border-radius:8px; padding:8px 14px; cursor:pointer;
  }
  .controls button:hover{background:#3d3428}
  .controls button.active{background:var(--accent); color:#1b1712; border-color:var(--accent)}
  .dots{display:flex; gap:6px}
  .dots button{min-width:44px}
  .spacer{flex:1}
  @media (max-width:640px){
    body{padding:16px 16px}
    .spacer{display:none} .controls button{padding:7px 10px;font-size:14px}
    .card img{display:none}
  }
</style>
</head>
<body>

<div class="stage" id="stage">
  <div class="cam" id="cam">
    <img src="images/scene1.jpg" alt="第一幕：烏雲下的秦朝咸陽宮">
    <img src="images/scene2.jpg" alt="第二幕：趙高牽著鹿走上大殿">
    <img src="images/scene3.jpg" alt="第三幕：秦二世指著鹿大笑">
    <img src="images/scene4.jpg" alt="第四幕：趙高轉身冷冷看著群臣">
    <img src="images/scene5.jpg" alt="第五幕：群臣有的沉默、有的說馬、有的說鹿">
    <img src="images/scene6.jpg" alt="第六幕：趙高在燭光下記下說真話的大臣">
    <div class="mouth" id="mouth"></div>
  </div>
  <div class="spot" id="spot"></div>
  <div class="dark" id="dark"></div>
  <div class="vignette"></div>
  <div class="flash" id="flash"></div>
  <div class="stamp" id="stamp"></div>
  <div class="bubble" id="bubble"></div>
  <div class="label" id="label"></div>
  <div class="subs" id="subs"></div>

  <div class="card" id="titleCard">
    <img src="images/char_zhaogao.jpg" alt="" style="object-position:12% 50%">
    <div class="txt">
      <h1>指鹿為馬<small>成語故事動畫</small></h1>
      <div class="zhuyin">ㄓˇ ㄌㄨˋ ㄨㄟˊ ㄇㄚˇ</div>
      <button class="btn-play" id="startBtn">▶ 開始播放</button>
      <p style="font-size:clamp(11px,1.3vw,15px);color:#7a6650">請打開喇叭，有旁白與音效</p>
    </div>
    <img src="images/char_deer.jpg" alt="" style="object-position:20% 50%">
  </div>

  <div class="card hidden" id="endCard">
    <img src="images/char_officials.jpg" alt="" style="height:auto;width:40%;object-fit:contain">
    <div class="txt">
      <h1 style="font-size:clamp(30px,6vw,80px)">指鹿為馬</h1>
      <p class="zhuyin">出自《史記‧秦始皇本紀》</p>
      <p class="moral"><b>意思：</b>指著鹿說是馬。比喻故意顛倒是非、混淆黑白。</p>
      <p style="font-size:clamp(12px,1.6vw,20px);color:#5c4a38">如果你是大殿上的大臣，<br>你會說<b>「鹿」</b>還是<b>「馬」</b>呢？為什麼？</p>
      <button class="btn-play" id="replayBtn">↻ 再看一次</button>
    </div>
  </div>
</div>

<div class="controls">
  <button id="prevBtn" title="上一幕">⏮ 上一幕</button>
  <button id="playBtn" title="暫停 / 播放">⏸ 暫停</button>
  <button id="nextBtn" title="下一幕">下一幕 ⏭</button>
  <div class="dots" id="dots"></div>
  <span class="spacer"></span>
  <button id="subBtn" class="active" title="字幕">字幕</button>
  <button id="voiceBtn" class="active" title="旁白語音">旁白</button>
  <button id="fsBtn" title="全螢幕">⛶ 全螢幕</button>
</div>

<script>
const $ = id => document.getElementById(id);
const stage=$('stage'), cam=$('cam'), imgs=[...cam.querySelectorAll('img')];
const subs=$('subs'), label=$('label'), bubble=$('bubble'), stamp=$('stamp'), flash=$('flash'), dark=$('dark'), spot=$('spot');

/* ---------- run control ---------- */
let runId = 0, current = -1, playing = false, voiceOn = true;
class Cancel extends Error {}
function guard(id){ if(id!==runId) throw new Cancel(); }
const wait = (ms, id=runId) => new Promise((res,rej)=>setTimeout(()=> id===runId?res():rej(new Cancel()), ms));

/* ---------- camera ---------- */
let camState = {x:.5,y:.5,s:1};
function camTransform({x,y,s}){
  const lim=(s-1)/2*100;
  const tx=Math.max(-lim,Math.min(lim,(.5-x)*s*100));
  const ty=Math.max(-lim,Math.min(lim,(.5-y)*s*100));
  return `translate(${tx}%,${ty}%) scale(${s})`;
}
function camTo(x,y,s,dur=2000,ease='cubic-bezier(.45,0,.25,1)'){
  const to={x,y,s};
  cam.animate([{transform:camTransform(camState)},{transform:camTransform(to)}],
    {duration:dur,easing:ease,fill:'forwards'});
  camState=to;
}
function camSet(x,y,s){ camTo(x,y,s,1); }
function shake(el=stage,dur=900,amp=10){
  const k=[]; for(let i=0;i<=12;i++){const a=amp*(1-i/12);
    k.push({translate:`${(Math.random()*2-1)*a}px ${(Math.random()*2-1)*a}px`});}
  k[k.length-1]={translate:'0 0'};
  el.animate(k,{duration:dur,easing:'linear'});
}
/* spotlight on a region: x,y center, r radius (0..1 of width) */
function spotOn(x,y,r=.25,alpha=.6){
  spot.style.background=`radial-gradient(circle at ${x*100}% ${y*100}%, transparent ${r*100}%, rgba(0,0,0,${alpha}) ${r*100+12}%)`;
  spot.style.opacity=1;
}
const spotOff=()=>{ spot.style.opacity=0; };
function stampText(t){
  stamp.textContent=t;
  stamp.animate([{opacity:0,transform:'translate(-50%,-50%) scale(.3) rotate(-8deg)'},
                 {opacity:1,transform:'translate(-50%,-50%) scale(1.15) rotate(-4deg)',offset:.15},
                 {opacity:1,transform:'translate(-50%,-50%) scale(1) rotate(-3deg)',offset:.8},
                 {opacity:0,transform:'translate(-50%,-50%) scale(1.3) rotate(-3deg)'}],{duration:2400,fill:'forwards'});
}

/* ---------- overlays ---------- */
function showBubble(text,x,y,cls=''){
  bubble.className='bubble '+cls; bubble.textContent=text;
  bubble.style.left=x*100+'%'; bubble.style.top=y*100+'%';
  requestAnimationFrame(()=>bubble.classList.add('on'));
}
const hideBubble=()=>bubble.classList.remove('on');
function setSub(html){ subs.innerHTML = html ? `<span>${html}</span>` : ''; }

/* ---------- speech ---------- */
let zhVoice=null;
function pickVoice(){
  const v=speechSynthesis.getVoices();
  zhVoice = v.find(x=>/zh[-_]TW/i.test(x.lang)) || v.find(x=>/zh[-_]HK/i.test(x.lang)) || v.find(x=>/^zh/i.test(x.lang)) || null;
}
if('speechSynthesis' in window){ pickVoice(); speechSynthesis.onvoiceschanged=pickVoice; }

const VOICES={
  narr :{rate:.92,pitch:1.0,  name:''},
  zhao :{rate:.82,pitch:.7,   name:'趙高'},
  emp  :{rate:1.08,pitch:1.45,name:'秦二世'},
  toady:{rate:1.25,pitch:1.2, name:'胖大臣'},
  loyal:{rate:.85,pitch:.85,  name:'老臣'}
};
/* ---------- lip sync ---------- */
/* 嘴巴位置（以整張圖的比例表示）：img＝第幾張場景圖，x,y＝上唇中央，w,h＝嘴張到最大的大小
   closed＝原圖嘴巴閉著，畫一張嘴開合；open＝原圖嘴巴已張開，把那塊往下拉長 */
const MOUTHS={
  zhao2 :{img:1, x:.533,y:.403,w:.009,h:.008,type:'closed'},
  emp3  :{img:2, x:.655,y:.215,w:.05, h:.05, type:'open', pull:.45},
  zhao4 :{img:3, x:.500,y:.471,w:.032,h:.021,type:'closed',stroke:2.5},
  toady5:{img:4, x:.427,y:.425,w:.03, h:.03, type:'open', pull:.5},
  loyal5:{img:4, x:.784,y:.449,w:.016,h:.014,type:'closed'}
};
const mouth=$('mouth');
const PUNCT=/[，。！？、：；「」…\s]/;
let lip=null;               // {text, rate, t0, base, idx, raf}
function mouthSetup(key){
  const m=MOUTHS[key]; if(!m) return false;
  mouth.className='mouth '+m.type;
  if(m.type==='closed'){
    // 畫一張清楚的嘴：墨色外框、上排牙齒、深色口腔、舌頭；外框粗細不隨開合變形
    Object.assign(mouth.style,{left:m.x*100+'%',top:m.y*100+'%',width:m.w*100+'%',height:'0%',backgroundImage:''});
    mouth.innerHTML=`<svg viewBox="0 0 100 60" preserveAspectRatio="none">
      <defs><clipPath id="mclip"><path d="M2,6 Q50,-3 98,6 Q86,60 50,60 Q14,60 2,6Z"/></clipPath></defs>
      <path d="M2,6 Q50,-3 98,6 Q86,60 50,60 Q14,60 2,6Z" fill="#3a0b08"/>
      <g clip-path="url(#mclip)">
        <rect x="0" y="0" width="100" height="16" fill="#f3ead8"/>
        <ellipse cx="50" cy="62" rx="30" ry="20" fill="#b44b42"/>
      </g>
      <path d="M2,6 Q50,-3 98,6 Q86,60 50,60 Q14,60 2,6Z" fill="none" stroke="#b4574e" stroke-opacity=".8"
        stroke-width="${m.stroke||2}" vector-effect="non-scaling-stroke" stroke-linejoin="round"/>
    </svg>`;
  }else{
    mouth.innerHTML='';
    // 取原圖嘴巴那一塊（上唇到下巴），之後往下拉長
    const L=m.x-m.w/2, T=m.y;
    Object.assign(mouth.style,{left:m.x*100+'%',top:T*100+'%',width:m.w*100+'%',height:m.h*100+'%',
      backgroundImage:`url(${imgs[m.img].getAttribute('src')})`,
      backgroundSize:`${100/m.w}% ${100/m.h}%`,
      backgroundPosition:`${L/(1-m.w)*100}% ${T/(1-m.h)*100}%`});
  }
  mouth.dataset.pull=m.pull||0;
  mouth.dataset.h=m.h;
  return true;
}
function setOpen(o){   // o: 0（閉）～1（最大）
  if(mouth.classList.contains('open')){
    mouth.style.opacity=1;
    mouth.style.transform=`translate(-50%,0) scaleY(${1+o*mouth.dataset.pull})`;
  }else{
    // 改變高度（不是縮放），外框才會一直清楚
    mouth.style.opacity=o>.08?1:0;
    mouth.style.height=(mouth.dataset.h*o*100)+'%';
  }
}
function lipStart(key,text,rate){
  lipStop();
  if(!mouthSetup(key)) return;
  const msPerChar=1000/(4.3*rate);       // 中文大約每秒 4.3 個字
  lip={text,msPerChar,base:performance.now(),baseIdx:0,amps:[...text].map(()=>.7+Math.random()*.3)};
  const tick=()=>{
    if(!lip) return;
    const el=performance.now()-lip.base, f=lip.baseIdx+el/lip.msPerChar;
    const i=Math.floor(f), ch=lip.text[i];
    let o=0;
    if(i<lip.text.length && ch && !PUNCT.test(ch)) o=Math.pow(Math.sin(Math.PI*(f-i)),.6)*lip.amps[i];   // 開得快、停得久，每個字更明顯
    setOpen(o);
    lip.raf=requestAnimationFrame(tick);
  };
  lip.raf=requestAnimationFrame(tick);
}
function lipSync(charIndex){ if(lip){ lip.base=performance.now(); lip.baseIdx=charIndex; } }
function lipStop(){ if(lip){ cancelAnimationFrame(lip.raf); lip=null; } setOpen(0); mouth.style.opacity=0; }

function say(text, who='narr', mouthKey=null){
  const id=runId, v=VOICES[who];
  setSub(v.name ? `<span class="${who}">${v.name}：「${text}」</span>` : text);
  const est = Math.max(1500, text.length*260+500);
  if(!voiceOn || !('speechSynthesis' in window)){
    if(mouthKey) lipStart(mouthKey,text,v.rate);
    return wait(est,id).finally(lipStop);
  }
  return new Promise((res,rej)=>{
    const u=new SpeechSynthesisUtterance(text);
    if(zhVoice) u.voice=zhVoice; u.lang=zhVoice?zhVoice.lang:'zh-TW';
    u.rate=v.rate; u.pitch=v.pitch;
    let done=false; const t0=performance.now();
    if(mouthKey){
      u.onstart=()=>lipStart(mouthKey,text,v.rate);
      u.onboundary=e=>lipSync(e.charIndex);   // 語音每唸到一個字詞，就把嘴巴對齊到那個字
    }
    const finish=()=>{ if(done) return; done=true; clearTimeout(t); lipStop();
      const rest=Math.max(250, est*.75-(performance.now()-t0));
      setTimeout(()=> id===runId ? res() : rej(new Cancel()), rest); };
    const t=setTimeout(finish, est*2.2+2000);
    u.onend=finish; u.onerror=finish;
    speechSynthesis.speak(u);
  });
}

/* ---------- sound effects (Web Audio) ---------- */
let ac=null, master, verb, bus, noiseBuf;
function initAudio(){
  if(ac) return;
  ac=new (window.AudioContext||window.webkitAudioContext)();
  master=ac.createDynamicsCompressor(); master.connect(ac.destination);
  const len=ac.sampleRate*2; noiseBuf=ac.createBuffer(1,len,ac.sampleRate);
  const d=noiseBuf.getChannelData(0); for(let i=0;i<len;i++) d[i]=Math.random()*2-1;
  const il=ac.sampleRate*3, ir=ac.createBuffer(2,il,ac.sampleRate);
  for(let c=0;c<2;c++){const b=ir.getChannelData(c);for(let i=0;i<il;i++)b[i]=(Math.random()*2-1)*Math.pow(1-i/il,2.5);}
  verb=ac.createConvolver(); verb.buffer=ir; const vg=ac.createGain(); vg.gain.value=.4;
  verb.connect(vg); vg.connect(master);
}
function newBus(){
  if(!ac) return;
  if(bus){ const old=bus; old.gain.setTargetAtTime(0,ac.currentTime,.15); setTimeout(()=>old.disconnect(),800); }
  bus=ac.createGain(); bus.connect(master); bus.connect(verb);
}
const now=()=>ac.currentTime;
function noise(t,dur,{type='lowpass',f=800,q=1,vol=.3,a=.005,r=dur}={}){
  const s=ac.createBufferSource(); s.buffer=noiseBuf; s.loop=true;
  const fl=ac.createBiquadFilter(); fl.type=type; fl.frequency.value=f; fl.Q.value=q;
  const g=ac.createGain(); g.gain.setValueAtTime(0,t);
  g.gain.linearRampToValueAtTime(vol,t+a); g.gain.exponentialRampToValueAtTime(.0001,t+a+r);
  s.connect(fl); fl.connect(g); g.connect(bus);
  s.start(t,Math.random()); s.stop(t+a+r+.05);
  return {fl,g};
}
function tone(t,f,vol,dur,type='sine'){
  const o=ac.createOscillator(), g=ac.createGain(); o.type=type; o.frequency.value=f;
  g.gain.setValueAtTime(0,t); g.gain.linearRampToValueAtTime(vol,t+.005);
  g.gain.exponentialRampToValueAtTime(.0001,t+dur); o.connect(g); g.connect(bus); o.start(t); o.stop(t+dur+.05);
}
/* 編鐘：pentatonic bronze bells */
function chime(start,notes){ if(!ac) return;
  notes.forEach(([dt,f])=>{ const t=now()+start+dt;
    [[1,.28,3],[2.76,.1,1.2],[5.4,.05,.6]].forEach(([r,a,d])=>tone(t,f*r,a,d)); }); }
/* 低沉的鼓 */
function drum(start,vol=.6){ if(!ac) return; const t=now()+start;
  const o=ac.createOscillator(), g=ac.createGain(); o.frequency.setValueAtTime(120,t);
  o.frequency.exponentialRampToValueAtTime(45,t+.4); g.gain.setValueAtTime(vol,t);
  g.gain.exponentialRampToValueAtTime(.0001,t+.9); o.connect(g); g.connect(bus); o.start(t); o.stop(t+1);
  noise(t,.12,{f:600,vol:vol*.3,r:.1}); }
function thunder(start,dur=4){ if(!ac) return; const t=now()+start;
  const {fl}=noise(t,dur,{f:180,q:.7,vol:.4,a:.4,r:dur});
  fl.frequency.setValueAtTime(260,t); fl.frequency.exponentialRampToValueAtTime(70,t+dur); }
function wind(start,dur){ if(!ac) return; const t=now()+start;
  const {fl}=noise(t,dur,{type:'bandpass',f:500,q:2,vol:.12,a:dur*.4,r:dur*.6});
  for(let i=1;i<6;i++) fl.frequency.linearRampToValueAtTime(350+Math.random()*400,t+dur*i/6); }
function hooves(start,count,gap=.5){ if(!ac) return;
  for(let i=0;i<count;i++){ const t=now()+start+i*gap;
    tone(t,900+Math.random()*80,.12,.06,'triangle'); tone(t+.07,700+Math.random()*60,.08,.05,'triangle'); } }
function giggle(start){ if(!ac) return;   // 二世的笑聲氣氛：快速上揚的音
  for(let i=0;i<6;i++){ tone(now()+start+i*.16, 520+i*40, .07, .12, 'triangle'); } }
function heartbeat(start,count,gap=.9){ if(!ac) return;
  for(let i=0;i<count;i++){ const t=start+i*gap; drum(t,.45); drum(t+.22,.3); } }
function murmur(start,dur){ if(!ac) return;
  for(let p=0;p<5;p++){ const t=now()+start+p*.3;
    const {fl}=noise(t,dur,{type:'bandpass',f:300+p*120,q:6,vol:.05,a:.6,r:dur});
    for(let i=1;i<10;i++) fl.frequency.linearRampToValueAtTime(250+p*120+Math.random()*200,t+dur*i/10); } }
function hush(start){ if(!ac) return; drum(start,.8); }
function crackle(dur){ if(!ac) return; let t=now()+.1;
  while(t<now()+dur){ noise(t,.03,{type:'highpass',f:2500,vol:.06+Math.random()*.06,r:.03}); t+=.08+Math.random()*.5; } }
function brush(start,count){ if(!ac) return;
  for(let i=0;i<count;i++) noise(now()+start+i*.7+Math.random()*.2,.35,{type:'bandpass',f:3000,q:.8,vol:.05,a:.1,r:.3}); }
function sting(start){ if(!ac) return; const t=now()+start;   // 不祥的低音
  [55,58.3,82.4].forEach(f=>tone(t,f,.18,3.5,'sawtooth')); }

/* ---------- scenes ---------- */
function showImg(i){ imgs.forEach((im,k)=>im.classList.toggle('on',k===i)); }
function setLabel(t){ label.classList.remove('on'); label.textContent=t; requestAnimationFrame(()=>label.classList.add('on')); }

const SCENES=[
  { title:'第一幕・烏雲下的秦宮', async run(id){
      showImg(0); camSet(.5,.3,1.6); newBus(); wind(0,14); thunder(1.2,4);
      chime(.3,[[0,392],[.5,440],[1,330],[1.5,294]]);
      await wait(1200,id);
      camTo(.5,.5,1.1,9000);
      await say('兩千多年前的秦朝，皇帝秦二世年紀輕輕，只愛玩樂，');
      await say('朝廷的大權，都落在丞相趙高的手裡。');
      camTo(.47,.45,1.5,3500);
      await say('趙高想自己當皇帝，卻又擔心大臣們不聽他的話。');
      await say('他想出了一個奇怪的辦法，來試探大家。');
      await wait(500,id);
  }},
  { title:'第二幕・獻上一匹「好馬」', async run(id){
      showImg(1); camSet(.3,.5,1.25); newBus(); hooves(.3,10,.55);
      await wait(800,id);
      camTo(.48,.45,1.35,4500);
      await say('有一天上朝，趙高牽來了一頭鹿。');
      camTo(.52,.35,1.8,1800);
      showBubble('臣獻上一匹好馬！',.55,.13,'cold');
      await say('陛下，臣獻給您一匹千里好馬！','zhao','zhao2');
      hideBubble();
      camTo(.4,.5,1.5,1600);
      showBubble('？？？',.4,.2);
      await say('大臣們你看我、我看你，那明明是一頭鹿呀！');
      hideBubble(); await wait(400,id);
  }},
  { title:'第三幕・皇帝哈哈大笑', async run(id){
      showImg(2); camSet(.6,.4,1.4); newBus(); giggle(.6); giggle(1.6);
      await wait(700,id);
      shake(cam,1200,5);
      showBubble('哈哈哈！',.68,.12);
      await say('秦二世看了，忍不住哈哈大笑：');
      camTo(.66,.35,1.7,1500);
      await say('丞相，你弄錯了吧？這明明是一頭鹿，怎麼說是馬呢？','emp','emp3');
      hideBubble();
      camTo(.28,.6,1.8,1800);
      showBubble('呦？',.32,.3);
      await say('連那頭鹿也歪著頭，好像在說：「我是鹿啊！」');
      hideBubble(); await wait(400,id);
  }},
  { title:'第四幕・是鹿，還是馬？', async run(id){
      showImg(3); camSet(.5,.6,1.05); newBus(); sting(.2); heartbeat(1.5,9);
      await wait(1000,id);
      await say('趙高的臉色一沉，慢慢轉過身，冷冷地看著大臣們。');
      camTo(.5,.3,1.9,4000,'cubic-bezier(.6,0,.3,1)');
      await wait(1500,id);
      showBubble('是鹿，還是馬？',.5,.1,'cold');
      await say('你們說說看，這到底是鹿，還是馬？','zhao','zhao4');
      hideBubble();
      camTo(.5,.5,1,1500);
      await say('大殿上一下子安靜下來，誰也不敢先開口。');
      await wait(600,id);
  }},
  { title:'第五幕・三種回答', async run(id){
      showImg(4); camSet(.5,.5,1); newBus(); murmur(0,6);
      await wait(900,id);
      spotOn(.24,.5,.17,.62); camTo(.27,.52,1.5,1600);
      await say('有些大臣低著頭，盯著地板，一句話也不說。');
      spotOn(.43,.35,.14,.62); camTo(.43,.4,1.7,1500);
      hush(0); showBubble('是馬！是馬！',.43,.1,'shout');
      await say('是馬！是馬！丞相說得對，這是一匹好馬！','toady','toady5');
      hideBubble();
      await say('有人為了討好趙高，搶著說是馬。');
      spotOn(.78,.45,.16,.62); camTo(.76,.45,1.6,1700);
      showBubble('這是鹿。',.78,.12,'true');
      await say('這明明是鹿，不是馬。','loyal','loyal5');
      hideBubble();
      await say('只有少數幾位大臣，挺直了腰，說出真話。');
      spotOff(); camTo(.5,.5,1,1800); await wait(900,id);
  }},
  { title:'第六幕・沒人敢說真話了', async run(id){
      showImg(5); camSet(.4,.45,1.3); newBus(); crackle(30); brush(1,6);
      await wait(1000,id);
      await say('趙高把說「鹿」的大臣，一個一個偷偷記了下來。');
      camTo(.75,.35,1.5,4000);
      sting(0);
      await say('後來，這些說真話的大臣，都被趙高找理由陷害了。');

      await wait(800,id);
      stampText('指鹿為馬'); drum(0,.8);

];

const dots=$('dots');
SCENES.forEach((s,i)=>{ const b=document.createElement('button'); b.textContent=['一','二','三','四','五','六'][i];
  b.title=s.title; b.onclick=()=>goto(i); dots.appendChild(b); });

function resetFx(){
  if('speechSynthesis' in window) speechSynthesis.cancel();
  hideBubble(); setSub(''); spotOff(); lipStop(); dark.style.opacity=0;
  stamp.getAnimations().forEach(a=>a.cancel());
}
async function goto(i){
  const id=++runId; resetFx(); initAudio(); if(ac.state==='suspended') ac.resume();
  $('titleCard').classList.add('hidden'); $('endCard').classList.add('hidden');
  playing=true; $('playBtn').textContent='⏸ 暫停';
  if(i>=SCENES.length){ return ending(); }
  current=i;
  [...dots.children].forEach((b,k)=>b.classList.toggle('active',k===i));
  setLabel(SCENES[i].title);
  try{
    await SCENES[i].run(id);
    guard(id); goto(i+1);
  }catch(e){ if(!(e instanceof Cancel)) console.error(e); }
}
function ending(){
  current=SCENES.length; playing=false; newBus(); setSub(''); label.classList.remove('on');
  [...dots.children].forEach(b=>b.classList.remove('active'));
  $('endCard').classList.remove('hidden'); $('playBtn').textContent='▶ 播放';
  chime(.2,[[0,294],[.4,330],[.8,392],[1.4,440]]);
  if(voiceOn && 'speechSynthesis' in window){
    const u=new SpeechSynthesisUtterance('指鹿為馬，就是指著鹿說是馬，比喻故意顛倒是非、混淆黑白。小朋友，如果你是大殿上的大臣，你會說鹿，還是馬呢？');
    if(zhVoice) u.voice=zhVoice; u.lang=zhVoice?zhVoice.lang:'zh-TW'; u.rate=.92; speechSynthesis.speak(u);
  }
}
function pause(){
  runId++; resetFx(); if(bus) bus.gain.setTargetAtTime(0,ac.currentTime,.1);
  cam.getAnimations().forEach(a=>a.pause());
  playing=false; $('playBtn').textContent='▶ 播放';
  setSub('（已暫停，按「播放」從這一幕開頭重新開始）');
}

$('startBtn').onclick=()=>goto(0);
$('replayBtn').onclick=()=>goto(0);
$('prevBtn').onclick=()=>goto(Math.max(0,Math.min(current,SCENES.length)-1));
$('nextBtn').onclick=()=>goto(current+1);
$('playBtn').onclick=()=> playing ? pause() : goto(current<0||current>=SCENES.length?0:current);
$('subBtn').onclick=e=>{ e.target.classList.toggle('active'); subs.classList.toggle('hide'); };
$('voiceBtn').onclick=e=>{ voiceOn=!voiceOn; e.target.classList.toggle('active',voiceOn); if(!voiceOn) speechSynthesis.cancel(); };
$('fsBtn').onclick=()=> document.fullscreenElement ? document.exitFullscreen() : stage.requestFullscreen();
document.addEventListener('keydown',e=>{
  if(e.code==='Space'){ e.preventDefault(); $('playBtn').click(); }
  if(e.code==='ArrowRight') $('nextBtn').click();
  if(e.code==='ArrowLeft') $('prevBtn').click();
});
</script>
